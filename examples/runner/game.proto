// The console supplies a seed and keystrokes. Each run owns its own state.
enum Tile { Ground, Gap, Barrier, Coin, AirCoin }
enum Action { Wait, Jump, Quit }
record Segment { tiles: list<Tile>, seed: int32 }
record Track { tiles: list<Tile>, next: Segment, offset: int32, behind: list<Tile> }

export record Run { coins: int32, distance: int32 }
export enum Outcome { Crash(Run), Abandoned }
record State { track: Track, phase: int32, run: Run }
enum Turn { Advance(State), Crash(Run) }
record Pace { until: int32, delay: int32<ms> }

pure ending fn increment(value: int32) -> int32 {
    match value + 1 {
        Ok(next) { return next; }
        Err(overflow) { return value; }
    }
}

pure ending fn segment(seed: int32) -> Segment {
    let draw = pseudoRandom(state: seed, 0, 3);
    // Every pattern leaves room to land before the next hazard.
    let mut tiles = [
        Tile::Ground, Tile::Ground, Tile::Coin, Tile::Ground,
        Tile::Barrier, Tile::AirCoin, Tile::Ground, Tile::Ground,
    ];
    if draw.value == 1 {
        tiles = [
            Tile::Ground, Tile::Coin, Tile::Ground, Tile::Gap,
            Tile::Gap, Tile::AirCoin, Tile::Ground, Tile::Ground,
        ];
    }
    if draw.value == 2 {
        tiles = [
            Tile::Ground, Tile::Ground, Tile::Barrier, Tile::AirCoin,
            Tile::Ground, Tile::Ground, Tile::Coin, Tile::Ground,
        ];
    }
    if draw.value == 3 {
        tiles = [
            Tile::Ground, Tile::Ground, Tile::Coin, Tile::Ground,
            Tile::Gap, Tile::AirCoin, Tile::Ground, Tile::Ground,
        ];
    }
    return Segment(tiles: tiles, seed: draw.state);
}

pure ending fn start(seed: int32) -> State {
    let tiles = [
        Tile::Ground, Tile::Ground, Tile::Ground, Tile::Coin,
        Tile::Ground, Tile::Ground, Tile::Coin, Tile::Ground,
    ];
    let behind = [Tile::Ground, Tile::Ground, Tile::Ground];
    return State(track: Track(tiles: tiles, next: segment(seed), offset: 0, behind: behind),
                 phase: 0, run: Run(coins: 0, distance: 0));
}

pure ending fn currentTile(track: Track) -> Tile {
    match at(track.tiles, track.offset) {
        Ok(tile) { return tile; }
        Err(outside) { return Tile::Ground; }
    }
}

pure ending fn advance(track: Track, passed: Tile) -> Track {
    let behind = prepend(passed, dropLast(track.behind));
    if track.offset == 7 {
        return Track(tiles: track.next.tiles, next: segment(track.next.seed), offset: 0, behind: behind);
    }
    return Track(tiles: track.tiles, next: track.next, offset: increment(track.offset), behind: behind);
}

pure ending fn nextPhase(phase: int32, jump: bool) -> int32 {
    if phase == 0 {
        if jump { return 1; }
        return 0;
    }
    if phase == 4 { return 0; }
    return increment(phase);
}

pure ending fn height(phase: int32) -> int32 {
    if phase == 2 { return 2; }
    if phase == 3 { return 2; }
    if phase == 0 { return 0; }
    return 1;
}

example "a gap ends a run at ground level" {
    input tile: Tile::Gap;
    input elevation: 0;
    expect true;
}
example "a jump clears a barrier" {
    input tile: Tile::Barrier;
    input elevation: 1;
    expect false;
}
pure deterministic ending fn hits(tile: Tile, elevation: int32) -> bool {
    if elevation > 0 { return false; }
    if tile == Tile::Gap { return true; }
    return tile == Tile::Barrier;
}

pure ending fn collects(tile: Tile, elevation: int32) -> bool {
    if elevation == 0 { return tile == Tile::Coin; }
    return tile == Tile::AirCoin;
}

pure ending fn visibleTile(track: Track, elevation: int32) -> Tile {
    let tile = currentTile(track);
    if collects(tile, elevation) { return Tile::Ground; }
    return tile;
}

pure ending fn tick(state: State, jump: bool) -> Turn {
    let track = advance(state.track, passed: visibleTile(state.track, height(state.phase)));
    let phase = nextPhase(state.phase, jump);
    let elevation = height(phase);
    let tile = currentTile(track);
    let distance = increment(state.run.distance);
    let mut coins = state.run.coins;
    if hits(tile, elevation) { return Turn::Crash(Run(coins: coins, distance: distance)); }
    if collects(tile, elevation) { coins = increment(coins); }
    return Turn::Advance(State(track: track, phase: phase, run: Run(coins: coins, distance: distance)));
}

example "the runner starts at two tiles per second" {
    input distance: 0;
    expect 500;
}
example "doubling a milestone raises speed by another half tile per second" {
    input distance: 32;
    expect 333;
}
pure deterministic ending fn tickDelay(distance: int32) -> int32<ms> {
    // Increase by half a tile per second at each doubling, up to 6 tiles/s.
    let bands = [
        Pace(until: 16, delay: 500), Pace(until: 32, delay: 400),
        Pace(until: 64, delay: 333), Pace(until: 128, delay: 286),
        Pace(until: 256, delay: 250), Pace(until: 512, delay: 222),
        Pace(until: 1024, delay: 200), Pace(until: 2048, delay: 182),
    ];
    for band in bands {
        if distance < band.until { return band.delay; }
    }
    return 167;
}

pure ending fn action(keys: list<string>) -> Action {
    let mut selected = Action::Wait;
    for key in keys {
        if key == "q" { return Action::Quit; }
        if key == " " { selected = Action::Jump; }
    }
    return selected;
}

fn readAction(terminal: console, delay: int32<ms>, interactive: bool) -> result<Action, HostError> {
    if interactive {
        match readKeysFor(terminal, timeout: delay) {
            Ok(keys) { return Ok(action(keys)); }
            Err(error) {
                if hostErrorKind(error) == HostErrorKind::EndOfInput { return Ok(Action::Quit); }
                return Err(error);
            }
        }
    }
    match input(terminal) {
        Ok(line) { return Ok(action([line])); }
        Err(error) {
            if hostErrorKind(error) == HostErrorKind::EndOfInput { return Ok(Action::Quit); }
            return Err(error);
        }
    }
}

pure ending fn paint(text: string, color: string, styled: bool) -> string {
    if styled {
        let start = concat(left: "\u001b[", right: concat(left: color, right: "m"));
        return concat(left: start, right: concat(left: text, right: "\u001b[0m"));
    }
    return text;
}

pure ending fn runnerSprite(row: int32, floor: int32, stride: bool) -> string {
    if row == increment(increment(floor)) { return " ◉  "; }
    if row == increment(floor) { return "╭█╯ "; }
    if row == floor {
        if floor > 0 { return " ╱╲ "; }
        if stride { return "╱ ╲ "; }
        return " ╲╱ ";
    }
    return "";
}

pure ending fn cell(tile: Tile, row: int32, styled: bool) -> string {
    if row < 0 {
        if tile == Tile::Gap { return "    "; }
        if row == -1 { return "▀▀▀▀"; }
        if row == -2 { return "▓▒▓▒"; }
        if row == -4 { return "▒░▒░"; }
        if row == -6 { return "▒░░▒"; }
        return "░▒░▒";
    }
    if tile == Tile::Barrier {
        if row == 2 { return paint("╲▓▓╱", color: "1;91", styled); }
        if row < 2 { return paint("▓▓▓▓", color: "91", styled); }
    }
    if tile == Tile::Coin {
        if row == 1 { return paint(" ◈  ", color: "1;93", styled); }
    }
    if tile == Tile::AirCoin {
        if row == 5 { return paint(" ◈  ", color: "1;93", styled); }
    }
    return "    ";
}

pure ending fn appendLine(screen: string, line: string) -> string {
    return concat(left: screen, right: concat(left: "\n", right: line));
}

pure ending fn bordered(text: string) -> string {
    return concat(left: "│", right: concat(left: text, right: "│"));
}

pure ending fn counter(value: int32) -> string {
    let mut text = formatInt32(value);
    let thresholds = [10, 100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000];
    for threshold in thresholds {
        if value < threshold { text = concat(left: " ", right: text); }
    }
    return text;
}

pure ending fn dashboard(run: Run, styled: bool) -> string {
    let coins = paint(counter(run.coins), color: "1;93", styled);
    let distance = paint(counter(run.distance), color: "1;96", styled);
    let title = paint("  RUNNER", color: "1;96", styled);
    let left = concat(left: title, right: "                    COINS ");
    let scores = concat(left: coins, right: concat(left: "        DISTANCE ", right: distance));
    return bordered(concat(left: left, right: concat(left: scores, right: " tiles ")));
}

