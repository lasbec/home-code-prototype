        "                      ·                                ╭────╮                 ",
        "      ✦                                       ·       ╭╯░░░ ╰╮           ✧    ",
        "                            ·                         │░░░   │                ",
        "               ·                       ·              ╰╮░   ╭╯                ",
        "                                 ✧                     ╰────╯                 ",
        "       ·                                                            ·         ",
        "                      ───────                                 ─────           ",
        "                 ──────                                 ────────              ",
        "                ╱ ╲             ·             ╱╱ ╲           ╱╲               ",
        "               ╱   ╲╲       ╱╲               ╱    ╲╲       ╱╱  ╲              ",
        "      ╲       ╱░░░░░▒╲    ╱╱░░╲            ╱╱░░░▒░░░╲    ╱╱░░░▒░╲             ",
        "     ╱░╲╲    ╱░░░░▒░░░╲ ╱╱░░░░░╲          ╱░░░▒░░░░░░╲ ╱╱░░░▒░░░░╲       ╱╲   ",
        "   ╱╱░░░░╲╲ ╱░░░▒░░░░░░╱░░░░░░▒░╲       ╱╱░░▒░░░░░░▒░░╱░░░▒░░░░░░▒╲    ╱╱░░╲  ",
        "  ╱░░░░▒░░░╱░░▒░░░░░░▒░░░░░░▒░░░░╲    ╱╱░░▒░░░░░░▒░░░░░░▒░░░▄▄▄▒░░░╲ ╱╱░░░░░╲ ",
        " ╱░░░▒░░░░░░▒░░░░░░▒░░░░░░▄▄▄░░░░▒╲ ╱╱░░▒░░░░░░▒░░░░░░▒▄▄▄▄░███░░░░░╱░░░░░░▒░╲",
        "╱░░▒░░░▄▄▄▄░░░░░░▒░▄▄▄▄▄▒░█▪█░░▒░░▄▄▄▄▄▄░░░░░▒░░░░░░▒░░█▪██▒█▪█░░▄▄▄▄▄▄░░▒░░░░",
        "░▄▄▄▄▄░████░▄▄░▒░░░█████░░███▒▄▄▄░██████░▄▄▒░░░░▄▄▄▄▄░░████░███░▒██████▒░░▄▄▄░",
