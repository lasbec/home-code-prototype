    input text: "[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[";
    expect Err(JsonError(kind: JsonErrorKind::DepthLimitExceeded, offset: 128));
}
export pure deterministic ending fn parse(text: string) -> result<JsonValue, JsonError> {
    let points = codePoints(text);
    if peek(points, maxOffset()) != endOfText() {
        return Err(JsonError(kind: JsonErrorKind::InputTooLong, offset: maxOffset()));
    }
    let mut state = ParseState(stack: Stack::Root, phase: Phase::Value, depth: 0, offset: 0);
    // Each successful step consumes at least one code point, including whitespace.
    for budget in points {
        let point = peek(points, state.offset);
        if point == endOfText() { return finishParse(state); }
        match parseStep(points, state, point) {
            Ok(next) { state = next; }
            Err(error) { return Err(error); }
        }
    }
    return finishParse(state);
}

pure ending fn findMember(members: list<JsonMember>, key: string) -> result<JsonValue, JsonAccessErrorKind> {
    let mut found = false;
    let mut value = JsonValue::Null;
    for member in members {
        if member.key == key {
            if found { return Err(JsonAccessErrorKind::AmbiguousKey); }
            found = true;
            value = member.value;
        }
    }
    if found { return Ok(value); }
    return Err(JsonAccessErrorKind::MissingKey);
}

pure ending fn findElement(items: list<JsonValue>, index: uint32) -> result<JsonValue, JsonAccessErrorKind> {
    let mut position: uint32 = 0;
    for item in items {
        if position == index { return Ok(item); }
        position = nextIndex(position);
    }
    return Err(JsonAccessErrorKind::IndexOutOfBounds);
}

pure ending fn accessSegment(value: JsonValue, segment: JsonPathSegment) -> result<JsonValue, JsonAccessErrorKind> {
    match value {
        Null { return Err(JsonAccessErrorKind::WrongValueKind); }
        Bool(flag) { return Err(JsonAccessErrorKind::WrongValueKind); }
        String(text) { return Err(JsonAccessErrorKind::WrongValueKind); }
        Number(spelling) { return Err(JsonAccessErrorKind::WrongValueKind); }
        Object(members) {
            match segment {
                Key(key) { return findMember(members, key); }
                Index(index) { return Err(JsonAccessErrorKind::WrongValueKind); }
            }
        }
        Array(items) {
            match segment {
                Key(key) { return Err(JsonAccessErrorKind::WrongValueKind); }
                Index(index) { return findElement(items, index); }
            }
        }
    }
}

