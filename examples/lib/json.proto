    input text: "[[],{},\"\\\"\\\\\\/\\b\\f\\n\\r\\t\"]";
    expect Ok(JsonValue::Array([JsonValue::Array([]), JsonValue::Object([]),
                               JsonValue::String("\"\\/\b\f\n\r\t")]));
}
