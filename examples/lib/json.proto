export pure deterministic ending fn serialize(value: JsonValue) -> result<string, JsonSerializeError> {
    let passes = renderPasses();
    let root = PendingValue(value: value, reversedPath: []);
    let mut pieces = [Piece::Pending(root)];
    let mut depth: uint32 = 0;
    for pass in passes {
        match renderLevel(pieces, depth) {
            Err(error) { return Err(error); }
            Ok(level) {
                match level {
                    Complete(text) { return Ok(text); }
                    More(next) { pieces = next; }
                }
            }
        }
        depth = nextIndex(depth);
    }
    return Err(JsonSerializeError(kind: JsonSerializeErrorKind::DepthLimitExceeded, path: []));
}
